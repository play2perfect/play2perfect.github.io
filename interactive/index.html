<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Play2Perfect · Interactive assembly</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#202e37;font-family:system-ui,sans-serif}header{padding:22px 30px;background:white;border-bottom:1px solid #dce3e8;display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}header a{color:#456273;text-decoration:none}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 76px)}#view{position:relative;min-height:420px}canvas{display:block;width:100%;height:100%}aside{padding:26px;background:white;border-left:1px solid #dce3e8}h2{font-size:18px;margin:0 0 10px}p{line-height:1.5;color:#586b77;font-size:14px}button{border:1px solid #cad5dc;border-radius:8px;background:#fff;padding:11px 14px;font-size:14px;cursor:pointer}button:disabled{opacity:.45;cursor:wait}#play{background:#207267;color:white;border:0}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}label{font-size:14px;display:block;margin:15px 0}#status{padding:12px;background:#edf4f2;border-radius:8px;font-size:14px;line-height:1.6;margin:0}#error{color:#a32929;white-space:pre-wrap}#hint{position:absolute;bottom:18px;left:22px;font-size:12px;color:#52626e;pointer-events:none}@media(max-width:800px){main{display:block;height:auto}#view{height:65vh}aside{border:0}header{padding:18px}h1{font-size:19px}}
body.embedded header{display:none}body.embedded main{height:100vh}
#loading-panel{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:430px;padding:20px;background:white;border:1px solid #dce3e8;border-radius:12px;z-index:2;box-shadow:0 4px 20px #20333a15}#loading-panel[hidden],#loading-retry[hidden]{display:none}
#toolbar{grid-column:2;grid-row:1;background:white;padding:20px 26px 8px;display:grid;grid-template-columns:1fr;gap:8px}#toolbar button{padding:11px 14px;min-height:46px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}.icon{flex:none;font-size:16px;line-height:1}#view{grid-column:1;grid-row:1/3}aside{grid-column:2;grid-row:2}main{grid-template-rows:auto minmax(0,1fr)}
@media(max-width:800px){#toolbar{padding:12px;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #dce3e8}#toolbar button{padding:11px 4px;gap:5px;font-size:13px}.wide-only{display:none}#view{height:60svh;min-height:320px}aside{padding:18px 16px 28px}body.embedded main{height:auto}}
#reset.restart{background:#207267;color:white;border-color:#207267}#play:disabled{cursor:not-allowed}
.control{margin-top:22px}.control:first-child{margin-top:0}
#task-label{grid-column:1/-1;margin:0;font-size:13px;font-weight:600;color:#586b77}
#task-description{grid-column:1/-1;margin:0 0 4px}
#task{grid-column:1/-1;width:100%;padding:11px;border:1px solid #cad5dc;border-radius:8px;font-size:16px;background:#fff;color:inherit}
.toggle{display:flex;align-items:flex-start;gap:9px;margin:0;font-size:15px;font-weight:600;line-height:1.35;cursor:pointer}
.toggle input{flex:none;width:17px;height:17px;margin:1px 0 0}

#loading-note,#error{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}#loading-note{max-height:260px;overflow:auto}main,#view,aside{min-width:0}
.touch-hint{display:none}@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><h1>Play2Perfect <span style="font-weight:400;color:#789">/ Interactive</span></h1><a href="../">Project ↗</a></header><main><div id="toolbar"><p id="task-label">Select Assembly Task</p><select id="task" aria-label="Select Assembly Task"><option value="screwing">Screwing</option><option value="fabrica">Multi-Part Assembly</option><option value="tight_insertion">Tight Insertion</option><option value="plug">iPhone Charger into Socket</option><option value="fork">YCB Fork in Rack</option></select><p id="task-description"></p><button id="play" disabled><span id="play-label">Play</span><span id="play-icon" class="icon" aria-hidden="true">▶️</span></button><button id="reset" disabled><span><span class="wide-only">Reset to </span>New Init</span><span class="icon" aria-hidden="true">🔄</span></button><button id="disturb" disabled><span>Disturb</span><span class="icon" aria-hidden="true">⚡</span></button></div><div id="view"><div id="loading-panel" role="status"><strong id="loading-progress">Loading scene and policy…</strong><p id="loading-note">Takes ~3–10 seconds to load.</p><button id="loading-retry" hidden>Reload demo</button> <button id="copy-error" hidden>Copy error details</button></div><div id="hint"><span class="mouse-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</span><span class="touch-hint">Drag to orbit · Pinch to zoom</span></div></div><aside><div id="status" role="status">Loading scene and policy…</div><div class="control"><label class="toggle" title="Simplifies the robot's visuals only; the simulation is unchanged. Restarts the demo."><input id="faster" type="checkbox"> Lower visual detail (helps if slow)</label></div><p id="error"></p><button id="retry" hidden>Reload demo</button></aside></main><script type="module" src="./bootstrap.mjs?v=9"></script></body></html>
